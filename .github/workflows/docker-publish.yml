name: Docker Publish

# 分支推送发布当前仓库的镜像，不依赖上游仓库的 release tag 或 Docker Hub secrets。
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # 手动运行也只允许 main/dev，避免其它分支覆盖部署标签。
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          # GHCR 镜像名称必须小写；自动适配 fork 的 owner/repository。
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'package.json version must be a stable version such as 1.0.0.' >&2
            exit 1
          fi
          version="$package_version"
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            version="${package_version}-dev+${GITHUB_SHA::7}"
          fi
          {
            echo "name=${image}"
            echo "version=${version}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              echo "${image}:latest"
              echo "${image}:${package_version}"
              echo "${image}:${package_version%.*}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.build_time }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.image.outputs.build_time }}
          cache-from: type=gha,scope=docker-${{ github.ref_name }}
          cache-to: type=gha,scope=docker-${{ github.ref_name }},mode=max

      - name: Write deployment summary
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Docker images'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            printf '\nDigest: `%s`\n' "$IMAGE_DIGEST"
            echo 'Server deployment instructions: docs/docker-ghcr-deploy.zh-CN.md'
          } >> "$GITHUB_STEP_SUMMARY"
